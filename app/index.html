<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Shore — Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">NEON SHORE <span>cover studio</span></div>
  <div class="text-fields">
    <label>Title <input id="captionInput" type="text" value="SOLMAR NIGHTS" maxlength="40" autocomplete="off"></label>
    <label>Subtitle <input id="subtitleInput" type="text" value="Vice City · 2026" maxlength="60" autocomplete="off"></label>
    <label>Badge <input id="badgeInput" type="text" value="EST. 2026" maxlength="24" autocomplete="off"></label>
    <div class="heat-wrap"><span>Heat</span><div class="heat-stars" id="heatStars"><button type="button">★</button><button type="button">★</button><button type="button">★</button><button type="button">★</button><button type="button">☆</button></div></div>
  </div>
  <div class="top-actions">
    <button id="undoBtn" type="button" disabled>Undo</button>
    <button id="redoBtn" type="button" disabled>Redo</button>
    <button id="shuffleBtn" type="button" class="accent">Surprise me</button>
    <label class="size-label">Size
      <select id="sizeSelect"></select>
    </label>
    <button id="exportBtn" type="button" class="accent">Export PNG</button>
  </div>
</header>
<main class="workspace">
  <aside class="toolbar">
    <section>
      <h2>Layout</h2>
      <div class="picker" id="layoutPicker"></div>
    </section>
    <section>
      <h2>Grade</h2>
      <div class="picker" id="gradePicker"></div>
    </section>
    <section>
      <h2>Title font</h2>
      <div class="picker" id="fontPicker"></div>
    </section>
    <section>
      <h2>Preset looks</h2>
      <div class="picker" id="presetPicker"></div>
    </section>
    <section>
      <h2>Panel border</h2>
      <div class="picker" id="borderPicker"></div>
    </section>
    <section>
      <h2>Finish</h2>
      <label class="check"><input id="foilToggle" type="checkbox" checked> Gold-foil title + rule</label>
      <label class="check"><input id="grainToggle" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignetteToggle" type="checkbox" checked> Vignette</label>
    </section>
    <section>
      <h2 id="panelLabel">Panel 1</h2>
      <div class="thumbs" id="photoThumbs"></div>
      <button id="uploadBtn" type="button" class="wide">Upload photos…</button>
      <label class="zoom-row">Zoom <input id="zoomSlider" type="range" min="100" max="300" value="100"> <span id="zoomLabel">100%</span></label>
      <p class="hint">Click a panel to select it. Drag inside a panel to pan, scroll to zoom, or drop a photo onto a panel.</p>
    </section>
  </aside>
  <section class="stage">
    <div id="cover" class="cover"></div>
  </section>
</main>
<input id="fileInput" type="file" accept="image/*" multiple hidden>
<script type="module" src="src/main.js"></script>
</body>
</html>
